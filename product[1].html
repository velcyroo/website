<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="VELCYRO product — contemporary streetwear built around original ideas.">
  <title>Product — VELCYRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .product-page{padding:70px 6vw 120px;background:#f2f1ec}
    .product-breadcrumb{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-bottom:35px}
    .product-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:6vw;align-items:start}
    .product-gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .product-photo{aspect-ratio:4/5;background:#deddd7;overflow:hidden;position:relative}
    .product-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .product-photo.placeholder{background:radial-gradient(circle at 50% 42%,#777,#222 55%,#090909)}
    .product-photo.placeholder:after{content:"VELCYRO / DEMO";position:absolute;left:22px;bottom:20px;color:#fff;font:700 10px "Space Grotesk";letter-spacing:.18em}
    .product-details{position:sticky;top:120px}
    .product-eyebrow{font-size:9px;letter-spacing:.2em;color:#777;font-weight:700}
    .product-details h1{font:600 clamp(40px,5vw,78px)/.86 "Space Grotesk";letter-spacing:-.08em;margin:16px 0 22px}
    .product-price{font-size:15px;font-weight:700;margin-bottom:32px}
    .product-price del{font-weight:400;color:#999;margin-left:10px}
    .product-description{font-size:13px;line-height:1.8;color:#666;max-width:520px;margin-bottom:30px}
    .product-meta{border-top:1px solid #ccc;border-bottom:1px solid #ccc;padding:18px 0;margin:30px 0}
    .meta-line{display:flex;justify-content:space-between;gap:20px;padding:7px 0;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .meta-line span:last-child{color:#777}
    .option-label{font-size:9px;letter-spacing:.15em;font-weight:700;text-transform:uppercase;margin-bottom:12px}
    .size-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
    .size-btn{min-width:52px;height:44px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:10px}
    .size-btn.active{background:#111;color:#fff;border-color:#111}
    .product-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .product-actions button{min-height:54px;border:0;cursor:pointer;font-size:9px;letter-spacing:.15em;font-weight:700}
    .product-actions .primary{background:#111;color:#fff}
    .product-actions .secondary{background:#fff;border:1px solid #111}
    .product-note{font-size:9px;line-height:1.7;color:#888;margin-top:18px}
    .product-related{padding:0 6vw 120px;background:#fff}
    .product-related h2{font:600 clamp(42px,6vw,80px)/.9 "Space Grotesk";letter-spacing:-.07em;padding-top:80px;margin:0 0 40px}
    @media(max-width:900px){
      .product-layout{grid-template-columns:1fr}
      .product-details{position:static}
    }
    @media(max-width:600px){
      .product-page{padding:40px 5vw 80px}
      .product-gallery{grid-template-columns:1fr}
      .product-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">VELCYRO<span>®</span></a>
    <nav class="desktop-nav">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#collections">Collections</a>
      <a href="about.html">About</a>
    </nav>
    <div class="header-tools">
      <a class="tool" href="index.html#shop">Continue Shopping</a>
      <a class="tool" href="checkout.html">Bag <b data-cart-count>0</b></a>
    </div>
  </header>

  <main class="product-page">
    <div class="product-breadcrumb"><a href="index.html">VELCYRO</a> / <span id="crumb">PRODUCT</span></div>
    <div id="productRoot"></div>
  </main>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="product.js"></script>
</body>
</html>
