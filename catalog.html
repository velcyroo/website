<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — VELCYRO</title><link rel="stylesheet" href="style.css">
<style>
.shop-page{background:#f2f1ec;min-height:100vh;padding:60px 6vw 100px}.shop-wrap{max-width:1250px;margin:auto}
.shop-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #ccc;padding-bottom:25px;margin-bottom:25px}.shop-title{font:600 clamp(55px,10vw,140px)/.8 "Space Grotesk";letter-spacing:-.09em;margin:0}
.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{height:42px;border:1px solid #bbb;background:#fff;padding:0 12px;font:10px "DM Sans"}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #d3d2cc;overflow:hidden}.pic{display:block;aspect-ratio:3/4;background:#ddd;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:15px;display:flex;justify-content:space-between;gap:10px}.name{text-decoration:none;font:600 14px "Space Grotesk"}.meta{display:block;color:#777;font-size:8px;margin-top:5px}.price{font-size:10px;white-space:nowrap}.count{font-size:8px;letter-spacing:.13em;color:#777;text-transform:uppercase;margin:15px 0}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.shop-head{display:block}.controls{margin-top:20px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html">VELCYRO<span>®</span></a><nav class="desktop-nav"><a href="catalog.html">Shop</a><a href="collections.html">Collections</a><a href="about.html">About</a></nav><div class="header-tools"><a class="tool" href="checkout.html">Bag <b data-cart-count>0</b></a></div></header>
<main class="shop-page"><div class="shop-wrap"><div class="shop-head"><h1 class="shop-title">Shop.</h1><div class="controls"><input id="q" placeholder="SEARCH"><select id="sort"><option value="featured">FEATURED</option><option value="price-low">PRICE LOW → HIGH</option><option value="price-high">PRICE HIGH → LOW</option><option value="name">NAME A → Z</option></select></div></div><div class="count" id="count"></div><div class="grid" id="grid"></div></div></main>
<script src="products.js"></script><script src="cart.js"></script><script src="catalog.js"></script><script>
const q=document.querySelector("#q"),sort=document.querySelector("#sort"),grid=document.querySelector("#grid");
function render(){let list=VELCYRO_CATALOG.all();const query=q.value.toLowerCase();if(query)list=list.filter(p=>`${p.name} ${p.category} ${p.collection} ${p.color}`.toLowerCase().includes(query));list=VELCYRO_CATALOG.sort(list,sort.value);document.querySelector("#count").textContent=`${list.length} PRODUCT${list.length===1?"":"S"}`;grid.innerHTML=list.map(p=>`<article class="card"><a class="pic" href="product.html?id=${p.id}"><img src="${p.images?.[0]||""}" alt="${p.name}" loading="lazy"></a><div class="info"><div><a class="name" href="product.html?id=${p.id}">${p.name}</a><span class="meta">${p.collection} · ${p.color}</span></div><span class="price">₹${p.price}</span></div></article>`).join("")||"<p>NO PRODUCTS FOUND.</p>"}q.oninput=render;sort.onchange=render;render();VELCYRO_CART.bindCount();
</script></body></html>
