<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — VELCYRO</title><link rel="stylesheet" href="style.css"><style>
.s{padding:65px 6vw 110px;background:#f2f1ec;min-height:100vh}.wrap{max-width:1200px;margin:auto}.title{font:600 clamp(55px,10vw,140px)/.82 "Space Grotesk";letter-spacing:-.09em;margin:18px 0 50px}.searchbar{display:flex;gap:8px;margin-bottom:25px}.searchbar input{height:52px;flex:1;border:1px solid #bbb;padding:0 15px;font:12px "DM Sans"}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #d3d2cc}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#ddd}.card div{padding:14px}.card a{text-decoration:none;font:600 15px "Space Grotesk"}.meta{display:block;font-size:8px;color:#777;margin-top:5px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><a class="brand" href="index.html">VELCYRO<span>®</span></a><nav class="desktop-nav"><a href="catalog.html">Shop</a><a href="collections.html">Collections</a><a href="about.html">About</a></nav><div class="header-tools"><a class="tool" href="checkout.html">Bag <b data-cart-count>0</b></a></div></header><main class="s"><div class="wrap"><p class="kicker">VELCYRO / SEARCH</p><h1 class="title">Find it.</h1><div class="searchbar"><input id="search" autofocus placeholder="SEARCH PRODUCTS, COLLECTIONS, COLORS..."></div><div class="grid" id="results"></div></div></main>
<script src="products.js"></script><script src="cart.js"></script><script src="search.js"></script><script>
const input=document.querySelector("#search"),out=document.querySelector("#results");input.value=new URLSearchParams(location.search).get("q")||"";
function render(){const ps=VELCYRO_SEARCH.search(input.value);out.innerHTML=ps.length?ps.map(p=>`<article class="card"><a href="product.html?id=${p.id}"><img src="${p.images?.[0]||""}" alt="${p.name}"></a><div><a href="product.html?id=${p.id}">${p.name}</a><span class="meta">${p.collection} · ₹${p.price}</span></div></article>`).join(""):"<p>NO MATCHES.</p>"}input.oninput=render;render();VELCYRO_CART.bindCount();
</script></body></html>
