<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist — VELCYRO</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html">VELCYRO<span>®</span></a><nav class="desktop-nav"><a href="catalog.html">Shop</a><a href="collections.html">Collections</a><a href="about.html">About</a></nav></header><main style="padding:70px 6vw;min-height:100vh"><p class="kicker">VELCYRO / SAVED</p><h1 style="font:600 clamp(55px,10vw,140px)/.82 'Space Grotesk';letter-spacing:-.09em">Wishlist.</h1><div id="w"></div></main><script src="products.js"></script><script src="wishlist.js"></script><script>function r(){let ids=VELCYRO_WISHLIST.get(),ps=(VELCYRO_PRODUCTS||[]).filter(p=>ids.includes(+p.id));document.querySelector("#w").innerHTML=ps.length?`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${ps.map(p=>`<article style="background:#fff"><a href="product.html?id=${p.id}"><img style="width:100%;aspect-ratio:3/4;object-fit:cover" src="${p.images?.[0]||''}" alt="${p.name}"></a><div style="padding:14px"><a href="product.html?id=${p.id}" style="text-decoration:none;font-weight:600">${p.name}</a><p>₹${p.price}</p><button data-r="${p.id}">REMOVE</button></div></article>`).join("")}</div>`:"<p>Your wishlist is empty.</p>";document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{VELCYRO_WISHLIST.toggle(b.dataset.r);r()})}r()</script></body></html>
