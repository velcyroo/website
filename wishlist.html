<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist — VELCYRO</title><link rel="stylesheet" href="style.css"><style>
.w{padding:65px 6vw 110px;background:#f2f1ec;min-height:100vh}.wrap{max-width:1200px;margin:auto}.title{font:600 clamp(55px,10vw,140px)/.82 "Space Grotesk";letter-spacing:-.09em;margin:18px 0 60px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #d4d3cd}.image{aspect-ratio:3/4;background:#ddd;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.info{padding:15px}.info a{text-decoration:none;font:600 16px "Space Grotesk"}.meta{display:block;color:#777;font-size:9px;margin-top:5px}.remove{border:0;background:none;padding:12px 15px 16px;font-size:8px;letter-spacing:.14em;cursor:pointer}.empty{padding:60px;background:#fff;border:1px solid #d4d3cd;text-align:center}.button{display:inline-flex;padding:15px 20px;background:#111;color:#fff;text-decoration:none;font-size:9px;letter-spacing:.14em;font-weight:700}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html">VELCYRO<span>®</span></a><nav class="desktop-nav"><a href="index.html#shop">Shop</a><a href="collections.html">Collections</a><a href="about.html">About</a></nav><div class="header-tools"><a class="tool" href="checkout.html">Bag <b data-cart-count>0</b></a></div></header>
<main class="w"><div class="wrap"><p class="kicker">VELCYRO / SAVED</p><h1 class="title">Wishlist.</h1><div id="wishlist"></div></div></main>
<script src="products.js"></script><script src="cart.js"></script><script src="wishlist.js"></script><script>
function render(){const ids=VELCYRO_WISHLIST.get();const ps=(window.VELCYRO_PRODUCTS||[]).filter(p=>ids.includes(Number(p.id)));const root=document.querySelector("#wishlist");if(!ps.length){root.innerHTML='<div class="empty"><p>Your wishlist is empty.</p><a class="button" href="index.html#shop">EXPLORE THE DROP →</a></div>';return;}root.innerHTML='<div class="grid">'+ps.map(p=>`<article class="card"><a class="image" href="product.html?id=${p.id}"><img src="${p.images?.[0]||''}" alt="${p.name}"></a><div class="info"><a href="product.html?id=${p.id}">${p.name}</a><span class="meta">${p.collection} · ₹${p.price}</span></div><button class="remove" data-remove="${p.id}">REMOVE FROM WISHLIST</button></article>`).join("")+'</div>';root.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{VELCYRO_WISHLIST.remove(b.dataset.remove);render()})}
render(); VELCYRO_CART.bindCount();
</script></body></html>
